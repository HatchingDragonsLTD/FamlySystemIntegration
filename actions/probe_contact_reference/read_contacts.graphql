# READ-ONLY. A child's contacts with everything the probe compares. Test values only; the probe
# keeps them in memory and prints booleans.
query ProbeRefRead($childIds: [ChildId!]!, $next: ContactCursor) {
  contacts {
    list(childIds: $childIds, nextToken: $next) {
      result {
        id
        name {
          fullName
        }
        email
        phoneNumbers {
          value
          phoneType
        }
        childIds
        emergencyContact
        roles {
          targetId
        }
        externalSystemsReferences {
          foreignId
          system
        }
        records(keys: [TITLE, OCCUPATION, RELATION, EXTRA_INFO, PLACE_OF_WORK]) {
          key
          value
        }
      }
      next
    }
  }
}
