# READ-ONLY. A child's contacts with ONLY the RELATION record (Famly returns one for every contact, with an
# empty value when unset; the key and whether the value is non-blank is all the caller keeps; the value is a
# value is all the caller keeps; the value itself is never printed or stored).
query OnboardChildContactRelations($childIds: [ChildId!]!, $next: ContactCursor) {
  contacts {
    list(childIds: $childIds, nextToken: $next) {
      result {
        id
        records(keys: [RELATION]) {
          key
          value
        }
      }
      next
    }
  }
}
