# READ-ONLY live scan of every child (past and future included, via
# `timeRange`) with each child's contacts, to find an email on OTHER children.
# `name.fullName` and `phoneNumbers.value` are selected ONLY so two copies of a
# contact can be compared for differences in memory; they are never printed,
# logged or stored.
query OnboardContactsScan(
  $siteIds: [SiteId!]!
  $next: ChildCursor
  $timeRange: NonEmptyLocalDateRangeInput
) {
  children {
    listBySiteIds(siteIds: $siteIds, nextToken: $next, timeRange: $timeRange) {
      result {
        id
        contacts {
          id
          email
          lastModifiedAt
          name {
            fullName
          }
          phoneNumbers {
            value
          }
        }
      }
      next
    }
  }
}
