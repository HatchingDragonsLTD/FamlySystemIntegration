# TEMPORARY backfill query -- see runner.py's module docstring for what this
# is and when to delete it. Minimal field selection only (id, externalId,
# name.fullName): the caller matches on externalId and shows fullName as a
# sanity-check label, nothing else.
#
# CONFIRMED AGAINST THE LIVE PUBLIC API (2026-09-30). This does NOT hit
# FAMLY_GRAPHQL_URL (the internal API every other action here uses) -- that
# schema has no bulk way to list a child's externalId at all. It hits Famly's
# separate PUBLIC API (see runner.py's `_public_client`), whose
# `children.listBySiteIds` does have it, paginated via `nextToken`/
# `ChildCursor`. `siteIds` is REQUIRED and accepts every institutionId this
# backfill should cover in one call -- confirmed live that passing several at
# once returns every matching child across all of them, not just the first.
#
# TIME RANGE (found 2026-10-14): `listBySiteIds` lists ONLY children enrolled
# today unless `timeRange` is given ("by default neither past nor future
# children are listed"). A child who has left, or who starts later, was simply
# absent from this roster, so their urn never matched. `timeRange` is passed
# from pull_roster's ROSTER_TIME_RANGE, the one place the range is defined.
query UrnLookupChildren(
  $siteIds: [SiteId!]!
  $next: ChildCursor
  $timeRange: NonEmptyLocalDateRangeInput
) {
  children {
    listBySiteIds(siteIds: $siteIds, nextToken: $next, timeRange: $timeRange) {
      result {
        id
        externalId
        name {
          fullName
        }
      }
      next
    }
  }
}
