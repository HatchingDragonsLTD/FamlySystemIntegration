# READ-ONLY. One site's bill payers with their invoice recipients' contact ids and their
# children's ids. No names, emails, phones or amounts are selected. includeDeleted is
# passed explicitly.
query ProbePayerRecipients($siteIds: [SiteId!]!, $next: BillPayerCursor, $includeDeleted: Boolean!) {
  billPayers {
    listBySiteIds(siteIds: $siteIds, nextToken: $next, includeDeleted: $includeDeleted) {
      result {
        billPayerId
        invoiceRecipients {
          contactId
        }
        children {
          childId
        }
      }
      next
    }
  }
}
